
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>{% block title %}CampusFix{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="navbar">
        <a class="brand" href="{{ url_for('index') }}">
            <span class="brand-icon">C</span>
            <span>CampusFix</span>
        </a>

        <nav>
            <a href="{{ url_for('index') }}">Home</a>
            <a href="#how-it-works">How it works</a>
            <a class="nav-button" href="report_new.html">Report an issue</a>
      
{% if session.get('user_id') %}
    <a href="{{ url_for('reports.notifications') }}">
        🔔 Notifications
        <span id="notification-count" hidden>0</span>
    </a>
{% endif %}

        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>CampusFix · Making our campus better, together.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>

{% if session.get('user_id') %}
<script>
async function updateNotificationCount() {
    try {
        const response = await fetch(
            "{{ url_for('reports.unread_notification_count') }}"
        );

        if (!response.ok) return;

        const data = await response.json();
        const badge = document.getElementById("notification-count");

        if (badge) {
            badge.textContent = data.count;
            badge.hidden = data.count === 0;
        }
    } catch (error) {
        console.error("Could not update notification count.");
    }
}

updateNotificationCount();
setInterval(updateNotificationCount, 5000);
</script>
{% endif %}

  
</body>
</html>
